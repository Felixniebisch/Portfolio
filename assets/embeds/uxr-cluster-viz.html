const TOOLD = ['tools_questionnaire','tools_design','tools_organizational','tools_analysis','tools_recruiting_testing','tools_ai_assistants'];
const RANGE = [-2, 3.4];
function L(){return S[LANG];}
function ring(v){return v.concat([v[0]]);}
function cats(){return D.dims.map(d=>L().dims[d]||d);}
function show(i, btn){document.querySelectorAll('.view').forEach((v,j)=>v.classList.toggle('on',i===j));
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');
 window.dispatchEvent(new Event('resize'));}

let lastEmployer = null;

function renderStatic(){
 const s=L();
 document.getElementById('t_title').textContent=s.title;
 document.getElementById('t_sub').innerHTML=s.sub;
 s.tabs.forEach((t,i)=>document.getElementById('tab'+i).textContent=t);
 document.getElementById('n_radar').textContent=s.n_radar;
 document.getElementById('n_prof').textContent=s.n_prof;
 document.getElementById('h_member').textContent=s.h_member;
 document.getElementById('t_member').textContent=s.member;
 document.getElementById('t_member2').textContent=s.member2;
 document.getElementById('t_membermeth').textContent=s.membermeth;
 document.getElementById('h_profile').textContent=s.h_profile;
 document.getElementById('t_evidence').innerHTML=s.evidence.map(e=>
  '<div class="dim"><span><b>'+e[0]+'</b> '+e[1]+'</span></div>').join('');
 document.getElementById('n_emp').textContent=s.n_emp;
 document.getElementById('h_empform').textContent=s.h_empform;
 document.getElementById('l_sen').textContent=s.l_sen;
 document.getElementById('l_tools').textContent=s.l_tools;
 document.getElementById('b_go').textContent=s.b_go;
 document.getElementById('h_result').textContent=s.h_result;
 document.getElementById('t_fitmeth').textContent=s.fitmeth;
 document.getElementById('n_pca').textContent=s.n_pca;
 document.getElementById('lb_en').classList.toggle('on',LANG==='en');
 document.getElementById('lb_de').classList.toggle('on',LANG==='de');
 // seniority select (preserve choice)
 const sen=document.getElementById('e_sen'); const cur=sen.value;
 sen.innerHTML=s.sen_opts.map(o=>'<option value="'+o[0]+'">'+o[1]+'</option>').join('');
 sen.value=cur;
 // sliders (preserve values)
 const vals={}, nas={};
 s.sliders.forEach((b,i)=>{const el=document.getElementById('e_b'+i);
  if(el){vals[i]=el.value; nas[i]=document.getElementById('na_b'+i).checked;}});
 document.getElementById('sliders').innerHTML=s.sliders.map((b,i)=>
  '<div class="q"><div class="lbl"><span>'+b[1]+' ↔ '+b[2]+'</span><span class="na"><input type="checkbox" id="na_b'+i+'"'+(nas[i]?' checked':'')+'> '+s.na+'</span></div><input type="range" min="1" max="7" value="'+(vals[i]||4)+'" id="e_b'+i+'"><div class="ends"><span>'+b[1]+'</span><span>'+b[2]+'</span></div></div>').join('');
 const checks={}; TOOLD.forEach(t=>{const el=document.getElementById('e_'+t); if(el) checks[t]=el.checked;});
 document.getElementById('toolchecks').innerHTML=TOOLD.map(t=>
  '<label style="margin-right:10px"><input type="checkbox" id="e_'+t+'"'+(checks[t]?' checked':'')+'> '+s.tools[t]+'</label>').join('');
 // cluster toggles (preserve checked + expanded state)
 document.getElementById('ctHdr').textContent=s.clusterHdr;
 const vis={}, exp={};
 document.querySelectorAll('.ctoggles input[type=checkbox]').forEach(inp=>vis[inp.dataset.c]=inp.checked);
 document.querySelectorAll('.ctoggles .cdesc').forEach(d=>exp[d.dataset.c]=d.classList.contains('on'));
 const tgL=document.getElementById('ctoggles_left'), tgR=document.getElementById('ctoggles_right');
 tgL.innerHTML=''; tgR.innerHTML='';
 for(let c=0;c<5;c++){
  const host=c<3?tgL:tgR;
  const ck=(vis[c]===undefined)?(c===0):vis[c];
  const ex=exp[c]===undefined?false:exp[c];
  const wrap=document.createElement('div'); wrap.className='ctype';
  wrap.innerHTML='<div class="chdr"><label><input type="checkbox" '+(ck?'checked':'')+' data-c="'+c+'"><span class="sw" style="background:'+COLORS[c]+'"></span>'+s.clusters[c]+' (n='+D.sizes[c]+')'+'</label>'+
   '<button class="exp" data-c="'+c+'" type="button">'+(ex?'▴':'▾')+'</button></div>'+
   '<div class="cdesc'+(ex?' on':'')+'" data-c="'+c+'">'+(s.clusterDesc[c]||'')+'</div>';
  wrap.querySelector('input').addEventListener('change',function(e){
   const v=e.target.checked?true:'legendonly';
   Plotly.restyle('radar',{visible:v},[c]); Plotly.restyle('biplot',{visible:v},[c]);});
  wrap.querySelector('.exp').addEventListener('click',function(e){
   const d=wrap.querySelector('.cdesc'); const open=d.classList.toggle('on');
   e.target.textContent=open?'▴':'▾';});
  host.appendChild(wrap);
 }
}

function renderPlots(){
 const s=L(); const C=cats(); const CR=ring(C);
 const polar={polar:{radialaxis:{range:RANGE,tickfont:{size:9}},angularaxis:{tickfont:{size:9}}},
  legend:{orientation:'h',y:-0.08},margin:{t:30},paper_bgcolor:'#fafafa'};
 const rtr=[];
 for(let c=0;c<5;c++){const v=D.centroids[c].map(x=>x===null?0:x);
  rtr.push({type:'scatterpolar',r:ring(v),theta:CR,fill:'toself',
   name:s.clusters[c]+' (n='+D.sizes[c]+')',line:{color:COLORS[c]},opacity:0.75});}
 Plotly.newPlot('radar',rtr,{...polar,showlegend:false},{responsive:true});

 const pcv=D.centroids[D.felix_cluster].map(x=>x===null?0:x);
 Plotly.newPlot('profradar',[
  {type:'scatterpolar',r:ring(pcv),theta:CR,fill:'toself',name:s.clusters[D.felix_cluster],line:{color:COLORS[D.felix_cluster]},opacity:0.7},
  {type:'scatterpolar',r:ring(D.felix),theta:CR,name:LANG==='de'?'Ich':'Me',line:{color:'#111',width:2.5,dash:'dot'},fill:'none'},
  {type:'scatterpolar',r:CR.map(()=>0),theta:CR,mode:'lines',name:s.avg,line:{color:'#999',dash:'dash',width:1},hoverinfo:'skip'}],polar,{responsive:true});

 if(lastEmployer){employerRender(lastEmployer);}else{
  Plotly.newPlot('empradar',[{type:'scatterpolar',r:ring(D.felix),theta:CR,name:LANG==='de'?'Ich':'Me',
   line:{color:'#111',width:2.5,dash:'dot'},fill:'none'},
   {type:'scatterpolar',r:CR.map(()=>0),theta:CR,mode:'lines',name:s.avg,
    line:{color:'#999',dash:'dash',width:1},hoverinfo:'skip'}],polar,{responsive:true});}

 const traces=[];
 for(let c=0;c<5;c++){const pts=D.points.filter(p=>p.c===c);
  traces.push({x:pts.map(p=>p.x),y:pts.map(p=>p.y),mode:'markers',type:'scatter',
   name:s.clusters[c]+' (n='+D.sizes[c]+')',marker:{color:COLORS[c],size:6,opacity:0.55},
   text:pts.map(p=>p.id),hovertemplate:'%{text}<extra>'+s.clusters[c]+'</extra>'});}
 traces.push({x:[D.felix_pc[0]],y:[D.felix_pc[1]],mode:'markers+text',type:'scatter',name:LANG==='de'?'Ich':'Me',
  marker:{color:'#111',size:14,symbol:'star'},text:[LANG==='de'?'Ich':'Me'],textposition:'top center',textfont:{size:12}});
 const shapes=[],annos=[];
 D.loadings.forEach(l=>{if(Math.hypot(l.x,l.y)<0.9)return;
  shapes.push({type:'line',x0:0,y0:0,x1:l.x,y1:l.y,line:{color:'#555',width:1}});
  annos.push({x:l.x*1.13,y:l.y*1.13,text:(s.dims[l.dim]||l.dim),showarrow:false,font:{size:10,color:'#333'}});});
 Plotly.newPlot('biplot',traces,{shapes:shapes,annotations:annos,
  xaxis:{title:'PC1',zeroline:true},yaxis:{title:'PC2',zeroline:true},
  legend:{orientation:'h',y:-0.12},margin:{t:10},hovermode:'closest',
  paper_bgcolor:'#fafafa',plot_bgcolor:'#fff'},{responsive:true});
 // respect toggle states
 document.querySelectorAll('.ctoggles input[type=checkbox]').forEach(inp=>{
  if(!inp.checked){Plotly.restyle('radar',{visible:'legendonly'},[+inp.dataset.c]);
   Plotly.restyle('biplot',{visible:'legendonly'},[+inp.dataset.c]);}});
}

function employer(){
 const s=L(); const sought={}, used={};
 const sen=document.getElementById('e_sen').value;
 if(sen!==''){sought['seniority']=D.qmap['seniority'][+sen];used['seniority']=true;}
 s.sliders.forEach((b,i)=>{if(!document.getElementById('na_b'+i).checked){
  sought[b[0]]=D.qmap[b[0]][+document.getElementById('e_b'+i).value-1];used[b[0]]=true;}});
 let anyTool=TOOLD.some(t=>document.getElementById('e_'+t).checked);
 if(anyTool){TOOLD.forEach(t=>{sought[t]=D.qmap[t][document.getElementById('e_'+t).checked?1:0];used[t]=true;});}
 lastEmployer={sought:sought, used:used};
 employerRender(lastEmployer);
}

function employerRender(st){
 const s=L(); const C=cats(); const CR=ring(C);
 const sought=st.sought, used=st.used;
 const sv=D.dims.map(d=>d in sought?sought[d]:null);
 let best=-1,bd=1e9;
 for(let c=0;c<5;c++){let sum=0,n=0;
  D.dims.forEach((d,j)=>{if(used[d]&&D.centroids[c][j]!==null){sum+=Math.pow(sought[d]-D.centroids[c][j],2);n++;}});
  if(n>0&&sum/n<bd){bd=sum/n;best=c;}}
 let gaps=[],labs=[];
 D.dims.forEach((d,j)=>{if(used[d]){gaps.push(Math.abs(sought[d]-D.felix[j]));labs.push(s.dims[d]||d);}});
 const meanGap=gaps.reduce((a,b)=>a+b,0)/gaps.length;
 const fit=Math.max(0,Math.round(100*(1-meanGap/2.5)));
 document.getElementById('empresult').style.display='block';
 document.getElementById('fitpct').textContent=s.fit+fit+'%';
 document.getElementById('empcluster').textContent=s.describing+s.clusters[best];
 document.getElementById('fitbars').innerHTML=labs.map((l,i)=>{
  const cl=Math.max(0,1-gaps[i]/2.5);
  return '<div class="fitrow"><span class="nm">'+l+'</span><div class="bar"><i style="width:'+Math.round(cl*100)+'%"></i></div><span class="gv">'+Math.round(cl*100)+'%</span></div>';}).join('');
 Plotly.react('empradar',[
  {type:'scatterpolar',r:ring(sv.map(v=>v===null?0:v)),theta:CR,fill:'toself',
   name:LANG==='de'?'Gesuchtes Profil':'Sought profile',line:{color:'#1e8449'},opacity:0.65},
  {type:'scatterpolar',r:ring(D.felix),theta:CR,name:LANG==='de'?'Ich':'Me',line:{color:'#111',width:2.5,dash:'dot'},fill:'none'},
  {type:'scatterpolar',r:ring(D.centroids[best].map(x=>x===null?0:x)),theta:CR,
   name:s.clusters[best],line:{color:COLORS[best]},opacity:0.5},
  {type:'scatterpolar',r:CR.map(()=>0),theta:CR,mode:'lines',name:s.avg,
   line:{color:'#999',dash:'dash',width:1},hoverinfo:'skip'}],
  {polar:{radialaxis:{range:RANGE,tickfont:{size:9}},angularaxis:{tickfont:{size:9}}},
   legend:{orientation:'h',y:-0.1},margin:{t:30},paper_bgcolor:'#fafafa'});
}

function setLang(l){LANG=l;renderStatic();renderPlots();}
renderStatic();renderPlots();
</script></body></html>
